name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-ed:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test (race)
        run: go test -race ./...

      # Run on its own so that a reproducibility failure reads as one in the
      # log, rather than as a line inside a full test run. -count=1 defeats the
      # result cache: a cached pass would make the gate decorative.
      #
      # A recording left stale by a code change fails here too, so there is no
      # separate "regenerate and check the tree is clean" step: it would test
      # the same condition, and miss a scenario that has no recording at all,
      # since git diff says nothing about untracked files.
      - name: reproducibility gate
        run: go test -count=1 ./internal/goldentest/
