name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-ed:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test (race)
        run: go test -race ./...

      # Run on its own so that a reproducibility failure reads as one in the
      # log, rather than as a line inside a full test run. -count=1 defeats the
      # result cache: a cached pass would make the gate decorative on any
      # branch that did not touch these packages.
      - name: reproducibility gate
        run: go test -count=1 ./internal/goldentest/

      # A recording that no longer matches the code is a failure, so it must
      # never be rewritten as a side effect of running the suite. If this step
      # dirties the tree, the committed recordings were stale.
      - name: recordings are current
        run: |
          go test -count=1 ./internal/goldentest/ -rewrite-golden
          if ! git diff --quiet -- internal/goldentest/testdata; then
            echo "Recordings changed when regenerated, so the committed ones are stale:"
            git --no-pager diff -- internal/goldentest/testdata
            exit 1
          fi
