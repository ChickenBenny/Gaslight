name: node-lies-about-a-receipt
description: The transaction is on chain the whole time; the node denies it for the first two calls
chain_id: 1337

timeline:
  - at_height: 2
    produce:
      txs:
        - id: alice-deposit
          from: alice
          to: exchange
          value: "1000000000000000000"

  - at_height: 3
    fault:
      method: eth_getTransactionReceipt
      type: false_200
      count: 2

end_at_height: 5
